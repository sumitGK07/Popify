<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popify — Music for the in-between</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 9 L8 16 M12 7 L12 17 M16 9 L16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">Popify</span>
    </div>

    <nav class="nav-main" aria-label="Primary">
      <button class="nav-item is-active" data-view="home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 11L12 3l9 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h5v-6h4v6h5V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Home
      </button>
      <button class="nav-item" data-view="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Search
      </button>
      <button class="nav-item" data-view="library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="4" height="16" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="10" y="7" width="4" height="13" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="17" y="2" width="4" height="18" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>
        Your Library
      </button>
    </nav>

    <div class="sidebar-divider"></div>

    <div class="library-panel">
      <div class="library-panel-head">
        <span>Playlists</span>
        <button class="icon-btn small" title="Create playlist" id="createPlaylistBtn">+</button>
      </div>
      <ul class="playlist-list" id="playlistList"><!-- injected --></ul>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-nav">
        <button class="icon-btn round" id="backBtn" title="Back">‹</button>
        <button class="icon-btn round" id="fwdBtn" title="Forward">›</button>
      </div>

      <div class="search-wrap" id="searchWrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="What do you want to hear?" autocomplete="off">
      </div>

      <div class="topbar-user">
        <div class="avatar" title="You">🎧</div>
      </div>
    </header>

    <section class="content" id="content">

      <!-- Home view -->
      <div class="view" id="view-home">
        <h1 class="greeting" id="greeting">Good evening</h1>

        <div class="quick-grid" id="quickGrid"><!-- injected --></div>

        <div class="row-head">
          <h2>Made for you</h2>
        </div>
        <div class="card-grid" id="madeForYouGrid"><!-- injected --></div>

        <div class="row-head">
          <h2>Popular albums</h2>
        </div>
        <div class="card-grid" id="albumsGrid"><!-- injected --></div>
      </div>

      <!-- Search view -->
      <div class="view" id="view-search" hidden>
        <h1 class="greeting">Search</h1>
        <p class="hint" id="searchHint">Start typing to find songs, artists or albums.</p>
        <div class="track-table" id="searchResults"></div>
      </div>

      <!-- Library / playlist view -->
      <div class="view" id="view-library" hidden>
        <div class="playlist-header" id="playlistHeader"></div>
        <div class="track-table" id="libraryTracks"></div>
      </div>

    </section>
  </main>
</div>

<!-- Now playing bar -->
<footer class="now-playing" id="nowPlaying">
  <div class="np-track">
    <div class="np-cover" id="npCover"><img src="" alt="" id="npCoverImg"></div>
    <div class="np-meta">
      <span class="np-title" id="npTitle">Nothing playing</span>
      <span class="np-artist" id="npArtist">Pick a song to start</span>
    </div>
    <button class="icon-btn like-btn" id="likeBtn" title="Save to Liked Songs">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.35-9.5-9A5.5 5.5 0 0112 5.5 5.5 5.5 0 0121.5 11c-2.5 4.65-9.5 9-9.5 9z" stroke="currentColor" stroke-width="1.7"/></svg>
    </button>
  </div>

  <div class="np-center">
    <div class="np-controls">
      <button class="icon-btn" id="shuffleBtn" title="Shuffle">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h3.5L16 18h4M4 18h3.5L11 13M16 6h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 3.5L20 6l-2.5 2.5M17.5 15.5L20 18l-2.5 2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="prevBtn" title="Previous">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" title="Play">
        <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>
        <svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button class="icon-btn" id="nextBtn" title="Next">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn" id="repeatBtn" title="Repeat">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V9a4 4 0 014-4h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M7 22l-4-4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="np-progress">
      <span class="np-time" id="curTime">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-handle" id="progressHandle"></div>
      </div>
      <span class="np-time" id="durTime">0:00</span>
    </div>
  </div>

  <div class="np-extra">
    <div class="eq" id="eqIndicator" aria-hidden="true"><span></span><span></span><span></span></div>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" class="vol-icon"><path d="M4 9v6h4l5 4V5L8 9H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 8a5 5 0 010 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div class="vol-track" id="volTrack">
      <div class="vol-fill" id="volFill"></div>
      <div class="vol-handle" id="volHandle"></div>
    </div>
  </div>
</footer>

<audio id="audio" preload="metadata"></audio>

<script src="script.js"></script>
</body>
</html>
